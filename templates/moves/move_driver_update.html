{% extends "base.html" %}
{% block title %}Move progress – QuickMove{% endblock %}

{% block content %}
<h2 class="mb-3">Update move status</h2>

<p class="text-muted">
    Move #{{ object.pk }}: {{ object.pickup_address }} → {{ object.dropoff_address }}
</p>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="mt-2">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'moves:detail' object.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </div>
</form>
{% endblock %}
